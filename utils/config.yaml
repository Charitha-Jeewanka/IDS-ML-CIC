# Data path configuration
data_paths:
    raw: "data/raw/"
    processed: "data/processed/"
    intermediate: "data/intermediate/"
    reports: "artifacts/reports/"
    parquet: "data/parquet/"

# Kafka configuration
kafka:
    bootstrap_servers: ["localhost:9092"]
    topic: "cicids-network-flows"
    partitions: 8
    replication_factor: 1
    
    # Producer settings
    producer:
        acks: "all"  # Wait for all replicas
        retries: 3
        batch_size: 16384
        linger_ms: 10
        compression_type: "snappy"
        partition_by: "Source_IP"
        buffer_memory: 33554432  # 32MB
    
    # Consumer settings
    consumer:
        group_id: "cicids-parquet-writer"
        auto_offset_reset: "earliest"
        enable_auto_commit: false
        max_poll_records: 500

# Schema Registry (Karapace)
schema_registry:
    url: "http://localhost:8081"
    enabled: false  # Set to true when Karapace is running

# Parquet storage configuration
parquet:
    output_path: "data/parquet/"
    compression: "snappy"  # Options: snappy, gzip, brotli, lz4
    partition_cols: []  # Time-based partitioning: ["date", "hour"]
    checkpoint_location: "artifacts/checkpoints/"
    row_group_size: 128  # MB
    page_size: 1024  # KB
    
    # PySpark streaming settings
    spark:
        app_name: "CICIDS-Kafka-Consumer"
        master: "local[*]"  # Use all cores
        trigger_interval: "10 seconds"
        max_offsets_per_trigger: 10000

# ETL Pipeline configuration
etl:
    # Data reading settings
    reader:
        backend: "pandas"  # Options: "pandas"
        chunk_size: 100000  # For large file processing
        encoding: "utf-8"
    
    # Data cleaning strategies
    cleaning:
        # Infinity value handling
        infinity:
            strategy: "max"  # Options: "max", "large_int", "drop"
            large_int_value: 1000000000  # Used when strategy is "large_int"
        
        # Missing value (NaN) handling
        missing:
            strategy: "drop"  # Options: "drop", "median", "mean", "forward_fill"
            threshold: 0.5  # Drop columns with > 50% missing values
        
        # Column name normalization
        columns:
            strip_whitespace: true
            lowercase: false
            replace_spaces: "_"  # Replace spaces with underscores
            remove_special_chars: false
    
    # Data validation settings
    validation:
        check_infinity: true
        check_missing: true
        check_schema: true
        check_duplicates: true
        generate_report: true
    
    # Output settings
    output:
        format: "csv"  # Options: "csv", "parquet"
        compression: null  # Options: null, "gzip", "snappy" (for parquet)
        save_stats: true  # Save cleaning statistics
        stats_format: "json"  # Options: "json", "csv"

# Logging configuration
logging:
    level: "INFO"  # Options: "DEBUG", "INFO", "WARNING", "ERROR"
    format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
    log_to_file: true
    log_file: "logs/etl_pipeline.log"

# ML Pipeline configuration
ml:
    model_type: "xgboost"  # Options: "xgboost", "lightgbm"
    data_dir: "data/parquet/"
    
    # Temporal split: Monday-Thursday for training
    train_files:
      - "Monday_WorkingHours_ISCX.parquet"
      - "Tuesday_WorkingHours_ISCX.parquet"
      - "Wednesday_workingHours_ISCX.parquet"
      - "Thursday_WorkingHours_Morning_WebAttacks_ISCX.parquet"
      - "Thursday_WorkingHours_Afternoon_Infilteration_ISCX.parquet"
    
    # Friday for testing (future attacks)
    test_files:
      - "Friday_WorkingHours_Morning_ISCX.parquet"
      - "Friday_WorkingHours_Afternoon_DDos_ISCX.parquet"
      - "Friday_WorkingHours_Afternoon_PortScan_ISCX.parquet"
    
    # Model configuration
    target_column: "Label"
    features_to_drop:
      - "Source_IP"
      - "Destination_IP"
      - "Source_Port"
      - "Destination_Port"
      - "Timestamp"
    
    # XGBoost hyperparameters
    xgboost:
      binary:
        objective: "binary:logistic"
        max_depth: 6
        learning_rate: 0.1
        n_estimators: 100
        subsample: 0.8
        colsample_bytree: 0.8
        eval_metric: "auc"
        tree_method: "hist"  # Fast for large datasets
        random_state: 42
        use_class_weights: true  # Handle imbalance
      
      multiclass:
        objective: "multi:softprob"
        max_depth: 8
        learning_rate: 0.05
        n_estimators: 200
        subsample: 0.8
        colsample_bytree: 0.8
        eval_metric: "mlogloss"
        tree_method: "hist"
        random_state: 42
    
    # Feature engineering
    feature_engineering:
      correlation_threshold: 0.95  # Remove highly correlated features
      variance_threshold: 0.01  # Remove low-variance features
      max_features: 30  # Top N features to keep
      feature_importance_method: "random_forest"  # Preliminary ranking
    
    # Class imbalance handling
    class_imbalance:
      use_smote: true
      smote_strategy: "auto"  # Balance minority classes
      smote_k_neighbors: 5
      random_state: 42
    
    # Data preprocessing
    preprocessing:
      scaling_method: "standard"  # Options: "standard", "minmax", "robust"
      handle_inf: "max"  # Replace infinity with max value
      handle_nan: "drop"  # Drop rows with NaN
    
    # PowerBI export configuration
    powerbi_export:
      output_path: "data/powerbi/"
      top_features: 10  # Top features to include for visualization
      include_probabilities: true
      include_shap_values: false  # Disabled: SHAP incompatible with Python 3.11
      # Note: Using XGBoost native feature importance instead (gain, cover, weight)


# MLflow configuration
mlflow:
  tracking_uri: "file:./mlruns"  # Local file-based tracking
  experiment_name: "CICIDS-IDS-AutoML"
  artifact_location: "artifacts/mlflow"
  
  # Auto-logging
  autolog:
    enabled: true
    log_models: true
    log_input_examples: true
    log_model_signatures: true


