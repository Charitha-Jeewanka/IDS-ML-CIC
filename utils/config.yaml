# Data path configuration
data_paths:
    raw: "data/raw/"
    processed: "data/processed/"
    intermediate: "data/intermediate/"
    reports: "artifacts/reports/"
    parquet: "data/parquet/"

# Kafka configuration
kafka:
    bootstrap_servers: ["localhost:9092"]
    topic: "cicids-network-flows"
    partitions: 8
    replication_factor: 1
    
    # Producer settings
    producer:
        acks: "all"  # Wait for all replicas
        retries: 3
        batch_size: 16384
        linger_ms: 10
        compression_type: "snappy"
        partition_by: "Source_IP"
        buffer_memory: 33554432  # 32MB
    
    # Consumer settings
    consumer:
        group_id: "cicids-parquet-writer"
        auto_offset_reset: "earliest"
        enable_auto_commit: false
        max_poll_records: 500

# Schema Registry (Karapace)
schema_registry:
    url: "http://localhost:8081"
    enabled: false  # Set to true when Karapace is running

# Parquet storage configuration
parquet:
    output_path: "data/parquet/"
    compression: "snappy"  # Options: snappy, gzip, brotli, lz4
    partition_cols: []  # Time-based partitioning: ["date", "hour"]
    checkpoint_location: "artifacts/checkpoints/"
    row_group_size: 128  # MB
    page_size: 1024  # KB
    
    # PySpark streaming settings
    spark:
        app_name: "CICIDS-Kafka-Consumer"
        master: "local[*]"  # Use all cores
        trigger_interval: "10 seconds"
        max_offsets_per_trigger: 10000

# ETL Pipeline configuration
etl:
    # Data reading settings
    reader:
        backend: "pandas"  # Options: "pandas"
        chunk_size: 100000  # For large file processing
        encoding: "utf-8"
    
    # Data cleaning strategies
    cleaning:
        # Infinity value handling
        infinity:
            strategy: "max"  # Options: "max", "large_int", "drop"
            large_int_value: 1000000000  # Used when strategy is "large_int"
        
        # Missing value (NaN) handling
        missing:
            strategy: "drop"  # Options: "drop", "median", "mean", "forward_fill"
            threshold: 0.5  # Drop columns with > 50% missing values
        
        # Column name normalization
        columns:
            strip_whitespace: true
            lowercase: false
            replace_spaces: "_"  # Replace spaces with underscores
            remove_special_chars: false
    
    # Data validation settings
    validation:
        check_infinity: true
        check_missing: true
        check_schema: true
        check_duplicates: true
        generate_report: true
    
    # Output settings
    output:
        format: "csv"  # Options: "csv", "parquet"
        compression: null  # Options: null, "gzip", "snappy" (for parquet)
        save_stats: true  # Save cleaning statistics
        stats_format: "json"  # Options: "json", "csv"

# Logging configuration
logging:
    level: "INFO"  # Options: "DEBUG", "INFO", "WARNING", "ERROR"
    format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
    log_to_file: true
    log_file: "logs/etl_pipeline.log"
